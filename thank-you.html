<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmed — H.A.S Royal Cool Service</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=Inter:wght@400;500;600;700&family=Oswald:wght@600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --navy: #0c1f33;
      --copper: #0f7f8c;
      --copper-light: #3fb6bf;
      --success-green: #25d366;
      --bg-gray: #f4f7f9;
      --card-border: #e2e8f0;
      --text-dark: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-gray);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .wrapper {
      width: 100%;
      max-width: 480px;
    }

    .thankyou-card {
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(12, 31, 51, 0.08);
      position: relative;
    }

    /* Success Animated Circle Icon */
    .icon-box {
      width: 80px;
      height: 80px;
      background: #e6f7f8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px auto;
      color: var(--copper);
    }

    .icon-box svg {
      width: 42px;
      height: 42px;
    }

    .thankyou-card h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 2rem;
      text-transform: uppercase;
      color: var(--navy);
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .thankyou-card p.subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 28px;
    }

    /* Highlighted Callback Card */
    .callback-card {
      background: #f8fafc;
      border: 1.5px dashed var(--copper-light);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
    }

    .pulse-badge {
      width: 44px;
      height: 44px;
      background: var(--navy);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }

    .pulse-badge svg {
      width: 22px;
      height: 22px;
    }

    .callback-info h4 {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
      color: var(--copper);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .callback-info p {
      font-size: 0.85rem;
      color: var(--text-dark);
      font-weight: 500;
      line-height: 1.3;
    }

    /* Buttons Stack */
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .btn-main {
      background: var(--copper);
      color: #ffffff;
    }

    .btn-main:hover {
      background: #0a5b64;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-dark);
    }

    .btn-outline:hover {
      background: #f1f5f9;
    }

    /* Mobile Responsive tweaks */
    @media (max-width: 480px) {
      .thankyou-card {
        padding: 30px 20px;
      }
      .thankyou-card h1 {
        font-size: 1.75rem;
      }
      .callback-card {
        padding: 12px;
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="thankyou-card">
      
      <!-- Big Success Check Icon -->
      <div class="icon-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>

      <h1>Booking Confirmed!</h1>
      <p class="subtitle">Aapki booking enquiry <strong>H.A.S Royal Cool Service</strong> ko mil gayi hai.</p>

      <!-- 5-Min Callback Highlight -->
      <div class="callback-card">
        <div class="pulse-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </div>
        <div class="callback-info">
          <h4>Lightning Fast Callback</h4>
          <p>Hamari team aapko agle <strong>5 minute ke andar</strong> call karke timing confirm karegi.</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <a href="index.html" class="btn btn-main">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Back To Home
        </a>
      </div>

    </div>
  </div>

</body>
</html>
